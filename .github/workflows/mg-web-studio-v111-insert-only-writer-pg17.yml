name: MG Web Studio V111 Insert-Only MFA Writer PG17

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v111-insert-only-writer-pg17.yml
      - apps/mg-web-studio-cloud/proposals/v111-insert-only-ledger-writer-review.sql
      - apps/mg-web-studio-cloud/tests/v111-pg17-insert-only-ledger.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v111-pg17-insert-only
  cancel-in-progress: false

jobs:
  nonlogin-writer-pg17-disposable:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: only-a-temporary-ci-fixture
          POSTGRES_DB: qa_ledger
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare disposable V110 base and V111 restricted writer
        env:
          V111_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$V111_PG_CONTAINER"
          docker exec -i "$V111_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger -c \
            'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          docker exec -i "$V111_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger \
            < proposals/v110-private-mfa-ledger-review-only.sql
          docker exec -i "$V111_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger \
            < proposals/v111-insert-only-ledger-writer-review.sql
      - name: Test real restricted PG17 writer and sixteen concurrent connections
        env:
          V111_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node --test --test-concurrency=1 tests/v111-pg17-insert-only-ledger.test.cjs
      - name: Never deploy this proposal
        run: |
          echo "Only disposable PG17 role; no live Supabase, user Auth, or migrations."
          echo "V67: 32 PENDING / 0 PASS. PR #7 DRAFT. Production NO_GO."

name: MG Web Studio V77 PostgreSQL Evidence - Offline

on:
  push:
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v77-pg-evidence.yml
      - apps/mg-web-studio-cloud/server/pg-catalog-evidence-v77.cjs
      - apps/mg-web-studio-cloud/server/tenant-evidence-matrix-v77.cjs
      - apps/mg-web-studio-cloud/tests/pg-catalog-evidence-v77.test.cjs
      - apps/mg-web-studio-cloud/tests/tenant-evidence-matrix-v77.test.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-web-studio-v77-offline
  cancel-in-progress: true

jobs:
  v77-native:
    name: Node 22 read-only catalog planning and pending RLS matrix
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      V70_TEST_ISOLATION: "1"
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and V77 syntax
        run: |
          node --version
          node --check server/pg-catalog-evidence-v77.cjs
          node --check server/tenant-evidence-matrix-v77.cjs
          node --check tests/pg-catalog-evidence-v77.test.cjs
          node --check tests/tenant-evidence-matrix-v77.test.cjs
      - name: V77 synthetic catalog and cross-tenant evidence tests
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-catalog-evidence-v77.test.cjs tests/tenant-evidence-matrix-v77.test.cjs
      - name: Regression V76 PG17 security and recovery
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-security-review-v76.test.cjs tests/pg-recovery-plan-v76.test.cjs
      - name: Regression V75 signed auth.sessions reader
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-session-reader-v75.test.cjs tests/pg-session-integration-v75.test.cjs
      - name: Regression V74 pinned auth
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pinned-auth-contract-v74.test.cjs tests/pinned-auth-integration-v74.test.cjs
      - name: Regression V73 bounded providers
        run: node --require ./server/native-network-guard-v70.cjs --test tests/bounded-provider-v73.test.cjs tests/resilient-session-integration-v73.test.cjs
      - name: Regression V72 session rotation
        run: node --require ./server/native-network-guard-v70.cjs --test tests/rotating-session-verifier-v72.test.cjs tests/rotating-session-integration-v72.test.cjs
      - name: Regression V71 signed JWT
        run: node --require ./server/native-network-guard-v70.cjs --test tests/jwt-public-verifier-v71.test.cjs tests/jwt-tenant-integration-v71.test.cjs
      - name: Regression V70 seven suites
        run: node scripts/run-v70-native-regressions.cjs --run-local-tests

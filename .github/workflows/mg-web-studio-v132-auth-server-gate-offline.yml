name: MG Web Studio V132 Auth API Session Gate No Auth RLS Change

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v132-auth-server-gate-offline.yml
      - apps/mg-web-studio-cloud/server/v132-auth-server-session-gate.cjs
      - apps/mg-web-studio-cloud/server/v127-supabase-native-mfa-bridge.cjs
      - apps/mg-web-studio-cloud/tests/v132-auth-server-session-gate.test.cjs

permissions:
  contents: read

jobs:
  official-getuser-session-contract:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Pinned checkout, no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 22 pinned action
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run offline official Auth getUser protocol regression with network blocked
        run: |
          set -euo pipefail
          node --require ./server/native-network-guard-v70.cjs --test --test-concurrency=1 tests/v132-auth-server-session-gate.test.cjs
      - name: Guardrail
        if: always()
        run: |
          echo "Mocked official getUser/getClaims only; actual Auth sign-out still needs QA evidence."
          echo "No managed auth.sessions SQL, no Auth RLS policy, no new privileged credentials."
          echo "No production or QA modification; V67 0/32, PR #7 DRAFT, NO_GO."

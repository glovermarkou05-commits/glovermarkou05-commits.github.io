name: MG Web Studio V80 PG17 Low-Footprint Laboratory - Offline

on:
  push:
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v80-low-footprint.yml
      - apps/mg-web-studio-cloud/server/pg-lab-safety-gate-v80.cjs
      - apps/mg-web-studio-cloud/server/pg-lab-isolation-v80.cjs
      - apps/mg-web-studio-cloud/tests/pg-lab-safety-gate-v80.test.cjs
      - apps/mg-web-studio-cloud/tests/pg-lab-isolation-v80.test.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-web-studio-v80-offline
  cancel-in-progress: true

jobs:
  v80-native:
    name: Node 22 hypothetical low-RAM capacity and Bazar-safe isolation
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      V70_TEST_ISOLATION: "1"
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout code with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V80 syntax only
        run: |
          node --version
          node --check server/pg-lab-safety-gate-v80.cjs
          node --check server/pg-lab-isolation-v80.cjs
          node --check tests/pg-lab-safety-gate-v80.test.cjs
          node --check tests/pg-lab-isolation-v80.test.cjs
      - name: V80 synthetic low-memory and BAZAR isolation - no network
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-lab-safety-gate-v80.test.cjs tests/pg-lab-isolation-v80.test.cjs
      - name: V79 local capacity synthetic regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/lab-capacity-v79.test.cjs tests/measure-pg-lab-capacity-v79.test.cjs
      - name: V78 six approvals and lab runbook regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-lab-authorization-v78.test.cjs tests/pg-lab-runbook-v78.test.cjs
      - name: V77 catalog evidence and multi-tenant matrix regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-catalog-evidence-v77.test.cjs tests/tenant-evidence-matrix-v77.test.cjs
      - name: V76 role privileges and recovery regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-security-review-v76.test.cjs tests/pg-recovery-plan-v76.test.cjs
      - name: V75 session reader regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-session-reader-v75.test.cjs tests/pg-session-integration-v75.test.cjs
      - name: V74 auth pinning regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pinned-auth-contract-v74.test.cjs tests/pinned-auth-integration-v74.test.cjs
      - name: V73 bounded provider regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/bounded-provider-v73.test.cjs tests/resilient-session-integration-v73.test.cjs
      - name: V72 rotating session regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/rotating-session-verifier-v72.test.cjs tests/rotating-session-integration-v72.test.cjs
      - name: V71 signed JWT regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/jwt-public-verifier-v71.test.cjs tests/jwt-tenant-integration-v71.test.cjs
      - name: V70 seven native suites
        run: node scripts/run-v70-native-regressions.cjs --run-local-tests

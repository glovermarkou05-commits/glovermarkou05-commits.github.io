name: MG Web Studio V100 Verified MFA AMR Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v100-mfa-amr-provenance-offline.yml
      - apps/mg-web-studio-cloud/server/v100-mfa-amr-provenance.cjs
      - apps/mg-web-studio-cloud/tests/v100-mfa-amr-provenance.test.cjs
      - apps/mg-web-studio-cloud/server/v101-mfa-row-corroboration.cjs
      - apps/mg-web-studio-cloud/tests/v101-mfa-row-corroboration.test.cjs
      - apps/mg-web-studio-cloud/server/v102-challenge-session-transaction.cjs
      - apps/mg-web-studio-cloud/tests/v102-challenge-session-transaction.test.cjs
      - apps/mg-web-studio-cloud/server/v98-trusted-assurance-adapter.cjs
      - apps/mg-web-studio-cloud/tests/v98-trusted-assurance-adapter.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v100-offline-mfa-provenance
  cancel-in-progress: false

jobs:
  v100-strict-mfa-source-only:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout in read-only mode without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove signed AMR must match independent reviewed source
        run: |
          node --require ./server/native-network-guard-v70.cjs --test tests/v102-challenge-session-transaction.test.cjs tests/v101-mfa-row-corroboration.test.cjs tests/v100-mfa-amr-provenance.test.cjs tests/v98-trusted-assurance-adapter.test.cjs tests/v97-sensitive-operation-gate.test.cjs
      - name: Formal NO_GO remains enforced
        run: echo "V100 uses mock backend providers; no Supabase SQL, MFA credentials or production. V67 32 PENDING/0 PASS."

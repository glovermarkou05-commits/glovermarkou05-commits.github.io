name: MG Web Studio V126 Durable MFA Verification Issuer PG17

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v126-durable-mfa-issuer-pg17.yml
      - apps/mg-web-studio-cloud/server/v126-durable-mfa-event-store.cjs
      - apps/mg-web-studio-cloud/server/v130-private-verified-mfa-composition.cjs
      - apps/mg-web-studio-cloud/server/v127-supabase-native-mfa-bridge.cjs
      - apps/mg-web-studio-cloud/server/v132-auth-server-session-gate.cjs
      - apps/mg-web-studio-cloud/server/v126-v2-only-sensitive-route.cjs
      - apps/mg-web-studio-cloud/tests/v126-durable-mfa-event-pg17.test.cjs
      - apps/mg-web-studio-cloud/server/v125-unique-verification-gateway.cjs
      - apps/mg-web-studio-cloud/qa/v119-atomic-business-lab.cjs
      - apps/mg-web-studio-cloud/server/v122-private-auth-session-row-reader.cjs
      - apps/mg-web-studio-cloud/qa/v118-scoped-writer-pool.cjs
      - apps/mg-web-studio-cloud/proposals/v110-private-mfa-ledger-review-only.sql
      - apps/mg-web-studio-cloud/proposals/v111-insert-only-ledger-writer-review.sql
      - apps/mg-web-studio-cloud/qa/v116-pg-driver/package-lock.json

permissions:
  contents: read

concurrency:
  group: mg-v126-durable-proof-lab-pr7
  cancel-in-progress: false

jobs:
  durable-proof-with-private-read-and-write-roles:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qa_ledger
          POSTGRES_PASSWORD: v126-ci-admin-fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Pinned checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install integrity locked PG driver without scripts
        run: |
          set -euo pipefail
          npm ci --prefix qa/v116-pg-driver --ignore-scripts --no-audit --no-fund
      - name: Create disposable Auth, insert-only ledger, fictional business and private MFA receipt database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger -c \
            'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger \
            < proposals/v110-private-mfa-ledger-review-only.sql
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger \
            < proposals/v111-insert-only-ledger-writer-review.sql
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger <<'SQL'
          CREATE ROLE mg_v118_ci_backend LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'v126-ci-writer-fixture';
          GRANT mg_auth_ledger_writer TO mg_v118_ci_backend WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          CREATE SCHEMA mg_v119_fictional;
          REVOKE ALL ON SCHEMA mg_v119_fictional FROM PUBLIC,anon,authenticated,service_role;
          CREATE TABLE mg_v119_fictional.completed_operations(
            event_key text PRIMARY KEY,
            operation text NOT NULL CHECK(operation IN ('publish','members','billing')),
            completed_at timestamptz NOT NULL DEFAULT clock_timestamp()
          );
          ALTER TABLE mg_v119_fictional.completed_operations ENABLE ROW LEVEL SECURITY;
          ALTER TABLE mg_v119_fictional.completed_operations FORCE ROW LEVEL SECURITY;
          REVOKE ALL ON mg_v119_fictional.completed_operations FROM PUBLIC,anon,authenticated,service_role;
          GRANT USAGE ON SCHEMA mg_v119_fictional TO mg_auth_ledger_writer;
          GRANT INSERT(event_key,operation) ON mg_v119_fictional.completed_operations TO mg_auth_ledger_writer;
          CREATE POLICY v119_lab_insert_only ON mg_v119_fictional.completed_operations
           FOR INSERT TO mg_auth_ledger_writer WITH CHECK (true);

          CREATE SCHEMA auth;
          REVOKE ALL ON SCHEMA auth FROM PUBLIC;
          CREATE TABLE auth.sessions (
            id uuid PRIMARY KEY,
            user_id uuid NOT NULL,
            not_after timestamptz,
            private_refresh_token text NOT NULL
          );
          REVOKE ALL ON auth.sessions FROM PUBLIC,anon,authenticated,service_role;
          CREATE ROLE mg_v122_ci_auth_reader LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'v126-ci-auth-fixture';
          GRANT USAGE ON SCHEMA auth TO mg_v122_ci_auth_reader;
          GRANT SELECT(id,user_id,not_after) ON auth.sessions TO mg_v122_ci_auth_reader;

          CREATE SCHEMA mg_v126_fictional;
          REVOKE ALL ON SCHEMA mg_v126_fictional FROM PUBLIC,anon,authenticated,service_role;
          CREATE TABLE mg_v126_fictional.verified_mfa_events(
            receipt_id uuid PRIMARY KEY,
            event_id uuid NOT NULL UNIQUE DEFAULT pg_catalog.gen_random_uuid(),
            proof_reference uuid NOT NULL UNIQUE,
            subject uuid NOT NULL,
            session_id uuid NOT NULL,
            method text NOT NULL CHECK(method IN ('totp','mfa/phone')),
            verified_at_sec bigint NOT NULL CHECK(verified_at_sec>0)
          );
          ALTER TABLE mg_v126_fictional.verified_mfa_events ENABLE ROW LEVEL SECURITY;
          ALTER TABLE mg_v126_fictional.verified_mfa_events FORCE ROW LEVEL SECURITY;
          REVOKE ALL ON mg_v126_fictional.verified_mfa_events FROM PUBLIC,anon,authenticated,service_role;
          CREATE ROLE mg_v126_ci_issuer LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'v126-ci-issuer-fixture';
          CREATE ROLE mg_v126_ci_reader LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'v126-ci-reader-fixture';
          GRANT USAGE ON SCHEMA mg_v126_fictional TO mg_v126_ci_issuer,mg_v126_ci_reader;
          GRANT SELECT(receipt_id,event_id,proof_reference,subject,session_id,method,verified_at_sec)
            ON mg_v126_fictional.verified_mfa_events TO mg_v126_ci_issuer,mg_v126_ci_reader;
          GRANT INSERT(receipt_id,proof_reference,subject,session_id,method,verified_at_sec)
            ON mg_v126_fictional.verified_mfa_events TO mg_v126_ci_issuer;
          CREATE POLICY v126_private_reader ON mg_v126_fictional.verified_mfa_events
            FOR SELECT TO mg_v126_ci_issuer,mg_v126_ci_reader USING(true);
          CREATE POLICY v126_private_issuer ON mg_v126_fictional.verified_mfa_events
            FOR INSERT TO mg_v126_ci_issuer WITH CHECK(true);
          SQL
      - name: Execute V126 persistent event tests and composed V125/V119/V122 integration
        env:
          CI: 'true'
          NODE_PATH: ${{ github.workspace }}/apps/mg-web-studio-cloud/qa/v116-pg-driver/node_modules
          V126_DISPOSABLE_ONLY: '1'
          V126_HOST: '127.0.0.1'
          V126_PORT: ${{ job.services.postgres.ports[5432] }}
          V126_DB: qa_ledger
          V126_ADMIN_PWD: v126-ci-admin-fixture
          V126_ISSUER_PWD: v126-ci-issuer-fixture
          V126_READER_PWD: v126-ci-reader-fixture
          V126_WRITER_PWD: v126-ci-writer-fixture
          V126_AUTH_READER_PWD: v126-ci-auth-fixture
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/v126-durable-mfa-event-pg17.test.cjs
      - name: Do not promote CI fixture to QA or production
        if: always()
        run: |
          echo 'V126 creates fictional private verified_mfa_events only within disposable PG17.'
          echo 'Trusted Supabase MFA attestation provider is NOT implemented or reviewed.'
          echo 'No production secrets, QA schema DDL, migrations, grants, or deployment.'
          echo 'No proof of linearizable Auth revocation, persistent retention or rollback on production.'
          echo 'No legacy V109/V121 routes are enabled; downgrade gate remains for human review.'
          echo 'PR #7 DRAFT, V67 32 PENDING/0 PASS, production NO_GO.'

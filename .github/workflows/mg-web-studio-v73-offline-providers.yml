name: MG Web Studio V73 Offline Provider Deadlines

on:
  push:
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v73-offline-providers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-web-studio-v73-offline
  cancel-in-progress: true

jobs:
  v73-native:
    name: Native V73 provider controls and synthetic regressions
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      V70_TEST_ISOLATION: "1"
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout without saving credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V73 syntax
        run: |
          node --version
          node --check server/bounded-provider-v73.cjs
          node --check server/resilient-session-verifier-v73.cjs
          node --check tests/bounded-provider-v73.test.cjs
          node --check tests/resilient-session-integration-v73.test.cjs
      - name: Test V73 providers and real-module tenant composition with synthetic data
        run: node --require ./server/native-network-guard-v70.cjs --test tests/bounded-provider-v73.test.cjs tests/resilient-session-integration-v73.test.cjs
      - name: Recheck V72 isolated rotation and sessions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/rotating-session-verifier-v72.test.cjs tests/rotating-session-integration-v72.test.cjs
      - name: Recheck V71 original asymmetric JWT verifier
        run: node --require ./server/native-network-guard-v70.cjs --test tests/jwt-public-verifier-v71.test.cjs tests/jwt-tenant-integration-v71.test.cjs
      - name: Recheck seven V70 regression suites
        run: node scripts/run-v70-native-regressions.cjs --run-local-tests

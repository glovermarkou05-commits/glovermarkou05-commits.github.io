name: MG Web Studio V133 Private QA Auth MFA Pipeline Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v133-private-qa-pipeline-offline.yml
      - apps/mg-web-studio-cloud/server/v133-private-qa-mfa-pipeline.cjs
      - apps/mg-web-studio-cloud/tests/v133-private-qa-mfa-pipeline.test.cjs
      - apps/mg-web-studio-cloud/server/v132-auth-server-session-gate.cjs
      - apps/mg-web-studio-cloud/server/v130-private-verified-mfa-composition.cjs
      - apps/mg-web-studio-cloud/server/v128-private-challenge-journal.cjs
      - apps/mg-web-studio-cloud/server/v128-supabase-claims-verifier.cjs
      - apps/mg-web-studio-cloud/server/v126-durable-mfa-event-store.cjs
      - apps/mg-web-studio-cloud/server/v127-supabase-native-mfa-bridge.cjs

permissions:
  contents: read

jobs:
  private-qa-pipeline:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Pinned checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22 pinned
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Offline QA composition tests with native network denied
        run: |
          set -euo pipefail
          node --require ./server/native-network-guard-v70.cjs --test --test-concurrency=1 tests/v133-private-qa-mfa-pipeline.test.cjs
      - name: Guardrail
        if: always()
        run: |
          echo "Synthetic injected official Supabase Auth interfaces and PG pools only."
          echo "No actual QA users, schema, roles or networks touched."
          echo "PR #7 DRAFT; V67 0/32; production NO_GO."

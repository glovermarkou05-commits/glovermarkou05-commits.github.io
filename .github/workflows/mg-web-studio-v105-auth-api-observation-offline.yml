name: MG Web Studio V105 Auth API Observation Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v105-auth-api-observation-offline.yml
      - apps/mg-web-studio-cloud/server/v105-auth-api-observation.cjs
      - apps/mg-web-studio-cloud/tests/v105-auth-api-observation.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v105-auth-api-offline
  cancel-in-progress: false

jobs:
  v105-no-real-auth-credentials:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Read-only checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test V105 Auth SDK contract with network blocked
        run: node --require ./server/native-network-guard-v70.cjs --test tests/v105-auth-api-observation.test.cjs
      - name: Keep V67 and production gated
        run: echo "V105 only observes mock Auth API signals; revocation and real MFA unverified. V67 32 PENDING and production NO_GO."

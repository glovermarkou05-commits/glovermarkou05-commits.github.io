name: MG Web Studio V84 GitHub Runner Capacity - No Database

on:
  push:
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v84-github-runner-preflight.yml
      - apps/mg-web-studio-cloud/server/github-runner-preflight-v84.cjs
      - apps/mg-web-studio-cloud/scripts/inspect-gh-runner-v84.cjs
      - apps/mg-web-studio-cloud/tests/github-runner-preflight-v84.test.cjs
      - apps/mg-web-studio-cloud/tests/inspect-gh-runner-v84.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-web-studio-v84-capacity
  cancel-in-progress: true

jobs:
  host-capacity-only:
    name: Read-only Ubuntu host survey, 32 V67 checks still pending
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NODE_ENV: test
      V70_TEST_ISOLATION: "1"
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout with no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict runner host preflight - read-only, no network sockets or PG
        run: |
          node --version
          node --check server/github-runner-preflight-v84.cjs
          node --check scripts/inspect-gh-runner-v84.cjs
          node --require ./server/native-network-guard-v70.cjs scripts/inspect-gh-runner-v84.cjs --json
      - name: V84 runner integrity and guarded CLI tests
        run: node --require ./server/native-network-guard-v70.cjs --test tests/github-runner-preflight-v84.test.cjs tests/inspect-gh-runner-v84.test.cjs
      - name: V82 offline catalog and V67 original acceptance contracts
        run: node --require ./server/native-network-guard-v70.cjs --test tests/v67-operational-pack-v82.test.cjs tests/review-v67-readiness-v82.test.cjs tests/security-acceptance-v67.test.cjs tests/v67-evidence-template.test.cjs
      - name: V81 host feasibility regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-host-feasibility-v81.test.cjs tests/inspect-pg-host-v81.test.cjs
      - name: V80 low-footprint regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-lab-safety-gate-v80.test.cjs tests/pg-lab-isolation-v80.test.cjs
      - name: V79 local capacity regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/lab-capacity-v79.test.cjs tests/measure-pg-lab-capacity-v79.test.cjs
      - name: V78 authorization request regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-lab-authorization-v78.test.cjs tests/pg-lab-runbook-v78.test.cjs
      - name: V77 PG evidence planning regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-catalog-evidence-v77.test.cjs tests/tenant-evidence-matrix-v77.test.cjs
      - name: V76 security and recovery regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-security-review-v76.test.cjs tests/pg-recovery-plan-v76.test.cjs
      - name: V75 synthetic auth session regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pg-session-reader-v75.test.cjs tests/pg-session-integration-v75.test.cjs
      - name: V74 pinned auth regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/pinned-auth-contract-v74.test.cjs tests/pinned-auth-integration-v74.test.cjs
      - name: V73 provider timeouts regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/bounded-provider-v73.test.cjs tests/resilient-session-integration-v73.test.cjs
      - name: V72 rotating sessions regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/rotating-session-verifier-v72.test.cjs tests/rotating-session-integration-v72.test.cjs
      - name: V71 signed JWT regressions
        run: node --require ./server/native-network-guard-v70.cjs --test tests/jwt-public-verifier-v71.test.cjs tests/jwt-tenant-integration-v71.test.cjs
      - name: V70 native foundational regressions
        run: node scripts/run-v70-native-regressions.cjs --run-local-tests

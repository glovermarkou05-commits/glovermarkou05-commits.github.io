name: MG Web Studio V109 Atomic MFA Redemption Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v109-atomic-redemption-offline.yml
      - apps/mg-web-studio-cloud/server/v109-atomic-mfa-redemption.cjs
      - apps/mg-web-studio-cloud/tests/v109-atomic-mfa-redemption.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v109-ledger-offline
  cancel-in-progress: false

jobs:
  v109-atomic-ledger-contract-offline:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify 21 offline tests with network blocked
        run: node --require ./server/native-network-guard-v70.cjs --test tests/v109-atomic-mfa-redemption.test.cjs
      - name: Explicit no production promotion
        run: echo "Offline simulated atomic provider only. No real session read, DB transaction or tenant operation. V67 32 PENDING, production NO_GO."

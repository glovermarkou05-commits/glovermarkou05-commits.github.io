name: MG Web Studio V96 Privacy-Safe Observability Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v96-observability-offline.yml
      - apps/mg-web-studio-cloud/server/v96-private-observability.cjs
      - apps/mg-web-studio-cloud/tests/v96-private-observability.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v96-offline-privacy-test
  cancel-in-progress: false

jobs:
  v96-no-io-observability:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout PR with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned setup-node action, Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Offline tests with native network denied
        run: |
          node --require ./server/native-network-guard-v70.cjs --test tests/v96-private-observability.test.cjs
          node --require ./server/native-network-guard-v70.cjs --test tests/v95-evidence-crosswalk.test.cjs
      - name: Explicit non-production status
        run: echo "V96 simulation has no storage, alert delivery, jobs, SQL or deployment; OBS-01/02/03/04 and all V67 remain PENDING."

name: MG Web Studio V99 Dedicated Auth Sandbox Gate Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v99-sandbox-readiness-offline.yml
      - apps/mg-web-studio-cloud/server/v99-sandbox-readiness.cjs
      - apps/mg-web-studio-cloud/tests/v99-sandbox-readiness.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v99-sandbox-offline
  cancel-in-progress: false

jobs:
  v99-prevent-unapproved-sandbox:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Read-only checkout no credentials retained
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fixed Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove false sandbox readiness cannot grant access
        run: |
          node --require ./server/native-network-guard-v70.cjs --test tests/v99-sandbox-readiness.test.cjs
      - name: Formal status remains unchanged
        run: echo "V99 is offline candidate review only; no Supabase connection, project creation, SQL, real MFA or production. V67=32 PENDING."

name: MG Web Studio V98 Trusted Auth Assurance Offline

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v98-trusted-assurance-offline.yml
      - apps/mg-web-studio-cloud/server/v98-trusted-assurance-adapter.cjs
      - apps/mg-web-studio-cloud/tests/v98-trusted-assurance-adapter.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v98-offline-auth-assurance
  cancel-in-progress: false

jobs:
  v98-no-supabase-or-network:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Read-only checkout no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fixed Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: V98 and V97 tests with native network disabled
        run: |
          node --require ./server/native-network-guard-v70.cjs --test tests/v98-trusted-assurance-adapter.test.cjs tests/v97-sensitive-operation-gate.test.cjs
      - name: Explicit formal NO_GO
        run: echo "V98 backend contracts only. NO Supabase calls, no credential or real MFA session, no SQL. V67 32 PENDING, production NO_GO."

name: MG Web Studio Temporary V117 Public Dependency Lock Generation

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v117-bootstrap-pg-lock-temporary.yml

permissions:
  contents: read

jobs:
  generate-public-lockfile-in-disposable-runner:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Node 22 setup action
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate public pg dependency lockfile for deterministic CI use
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg-v117-pg-driver"
          printf '{"name":"mg-web-studio-pg-ci-driver","version":"1.0.0","private":true,"dependencies":{"pg":"8.23.1"}}\n' > "$RUNNER_TEMP/mg-v117-pg-driver/package.json"
          cd "$RUNNER_TEMP/mg-v117-pg-driver"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const l=require("./package-lock.json"); if(l.packages["node_modules/pg"].version!=="8.23.1")process.exit(2);for(const [name,p] of Object.entries(l.packages)){if(name!==""&&(!p.integrity||!p.resolved||!p.resolved.startsWith("https://registry.npmjs.org/")))process.exit(3)}'
          echo 'BEGIN_V117_PUBLIC_LOCK_B64'
          base64 -w0 package-lock.json
          echo
          echo 'END_V117_PUBLIC_LOCK_B64'
          echo 'ONLY PUBLIC REGISTRY METADATA. NO PRIVATE KEYS. NO SUPABASE CONNECTION.'

name: MG Web Studio V70 Native Security Tests

on:
  push:
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v70-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-v70-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-no-network-tests:
    name: Node 22 isolated security regression
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      V70_TEST_ISOLATION: "1"
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout exact feature branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Node version and seven local suites
        run: |
          node --version
          node scripts/run-v70-native-regressions.cjs --check
      - name: Validate V70 network guard (14 native tests)
        run: node --test tests/native-network-guard-v70.test.cjs
      - name: Run seven native regression suites with no-network preload
        run: node scripts/run-v70-native-regressions.cjs --run-local-tests
      - name: Retest complete V60-V69 tenant chain using native Node
        run: node --require ./server/native-network-guard-v70.cjs --test tests/unbound-tenant-stack-v70-native.test.cjs

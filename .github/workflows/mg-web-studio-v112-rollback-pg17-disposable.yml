name: MG Web Studio V112 Guarded Rollback PG17

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/mg-digital-v5-web-services
    paths:
      - .github/workflows/mg-web-studio-v112-rollback-pg17-disposable.yml
      - apps/mg-web-studio-cloud/proposals/v112-rollback-guarded-review-only.sql
      - apps/mg-web-studio-cloud/tests/v112-guarded-rollback-pg17.test.cjs

permissions:
  contents: read

concurrency:
  group: mg-webstudio-v112-rollback-disposable
  cancel-in-progress: false

jobs:
  guarded-rollback-disposable:
    if: github.repository == 'glovermarkou05-commits/glovermarkou05-commits.github.io' && github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/mg-web-studio-v94-preflight-20261101' && github.base_ref == 'feature/mg-digital-v5-web-services'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: temporary-fixture-only
          POSTGRES_DB: qa_ledger
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/mg-web-studio-cloud
        shell: bash
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare V110 and V111 only in disposable PG17
        env:
          V112_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$V112_PG_CONTAINER"
          docker exec -i "$V112_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger -c \
            'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          docker exec -i "$V112_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger \
            < proposals/v110-private-mfa-ledger-review-only.sql
          docker exec -i "$V112_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_ledger \
            < proposals/v111-insert-only-ledger-writer-review.sql
      - name: Run eleven guarded rollback tests
        env:
          V112_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node --test --test-concurrency=1 tests/v112-guarded-rollback-pg17.test.cjs
      - name: Confirm this is not a Supabase deployment
        run: |
          echo "V112 rollback exercised only against a disposable container."
          echo "No QA SQL applied; PR #7 draft; V67 32 PENDING, production NO_GO."
